get:
  security: []
  summary: VNPAY IPN callback
  description: This endpoint is used by VNPAY to send IPN (Instant Payment Notification) to our system.
  operationId: vnpayIpn
  tags:
    - Billing
  parameters:
    - name: vnp_Amount
      in: query
      required: true
      schema:
        type: integer
        format: int64
    - name: vnp_BankCode
      in: query
      required: false
      schema:
        type: string
    - name: vnp_BankTranNo
      in: query
      required: false
      schema:
        type: string
    - name: vnp_CardType
      in: query
      required: false
      schema:
        type: string
    - name: vnp_OrderInfo
      in: query
      required: false
      schema:
        type: string
    - name: vnp_PayDate
      in: query
      required: false
      schema:
        type: string
    - name: vnp_ResponseCode
      in: query
      required: true
      schema:
        type: string
    - name: vnp_SecureHash
      in: query
      required: true
      schema:
        type: string
    - name: vnp_TmnCode
      in: query
      required: false
      schema:
        type: string
    - name: vnp_TransactionNo
      in: query
      required: false
      schema:
        type: string
    - name: vnp_TransactionStatus
      in: query
      required: false
      schema:
        type: string
    - name: vnp_TxnRef
      in: query
      required: true
      schema:
        type: string
        format: uuid
  responses:
    200:
      description: VNPAY IPN result
      content:
        application/json:
          schema:
            type: object
            properties:
              RspCode:
                type: string
                example: '01'
              Message:
                type: string
                example: 'Success'
            required:
              - RspCode
              - Message
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
